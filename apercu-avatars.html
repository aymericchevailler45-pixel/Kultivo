<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu avatars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Page d'APERÇU seulement (2026-10-24) : cadres à gagner et couleurs spéciales, pour choisir avant de les mettre dans le jeu. -->
<style>
    body { padding: 16px; }
    .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
    .card h2 { margin: 0 0 4px; }
    .card > p { margin: 0 0 12px; color: var(--muted); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 12px 6px; border: 2px solid var(--line); border-radius: 16px; }
    .item b { font-size: 0.95rem; }
    .item small { color: var(--muted); font-weight: 700; line-height: 1.3; }
    .price { color: #c9952b; font-weight: 900; }
    .row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 2px solid var(--line); font-weight: 800; }
    .row:last-child { border-bottom: 0; }
    .row .who { flex: 1; }

    /* Avatar de base (comme dans le jeu) */
    .av { position: relative; display: inline-flex; flex: none; }
    .av .league-avatar { width: 64px; height: 64px; font-size: 1.7rem; }
    .av.small .league-avatar { width: 34px; height: 34px; font-size: 0.95rem; border-width: 2px; }
    .av .league-avatar .emoji-img { width: 60%; height: 60%; }

    /* ---------- CADRES À GAGNER ---------- */
    .frame .league-avatar { box-shadow: none; }
    .frame::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; z-index: -1; }
    .av.small.frame::before { inset: -3px; }
    .frame { z-index: 0; }
    .av-tag { position: absolute; width: 26px; height: 26px; right: -6px; bottom: -4px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25)); }
    .av.small .av-tag { width: 16px; height: 16px; right: -5px; bottom: -3px; }
    .av-tag.top { right: auto; left: 50%; bottom: auto; top: -18px; transform: translateX(-50%); width: 30px; height: 30px; }
    .av.small .av-tag.top { top: -11px; width: 18px; height: 18px; }

    /* Champion de la ligue : or */
    .f-champion::before { background: conic-gradient(#fff3b0, #ffc800, #c9952b, #ffe680, #ffc800, #fff3b0); box-shadow: 0 0 14px rgba(255, 200, 0, 0.6); }
    /* Série de 30 jours : flamme qui tourne */
    .f-flame::before { background: conic-gradient(#ff3d00, #ff9100, #ffd600, #ff9100, #ff3d00); animation: spin 2.5s linear infinite; box-shadow: 0 0 14px rgba(255, 110, 0, 0.55); }
    /* Maître : violet et or */
    .f-master::before { background: conic-gradient(#8b5cf6, #c4b5fd, #ffc800, #8b5cf6, #c4b5fd, #ffc800, #8b5cf6); }
    /* Événement Halloween */
    .f-halloween::before { background: repeating-conic-gradient(#ff7a00 0 30deg, #2b1b3d 30deg 60deg); }

    /* ---------- COULEURS SPÉCIALES (à acheter) ---------- */
    .s-sunset .league-avatar { background: linear-gradient(135deg, #ffb347, #ff4f8b); }
    .s-ocean .league-avatar { background: linear-gradient(135deg, #2bd2ff, #2b5cff); }
    .s-aurora .league-avatar { background: linear-gradient(135deg, #43e97b, #38b6ff, #8b5cf6); }
    .s-rainbow .league-avatar { background: conic-gradient(#ff4d4d, #ffb84d, #f9f871, #4dff88, #4dd2ff, #8b5cf6, #ff4dd2, #ff4d4d); }
    .s-galaxy .league-avatar {
        background:
            radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 70% 20%, #fff 50%, transparent 51%),
            radial-gradient(1px 1px at 55% 70%, #fff 50%, transparent 51%),
            radial-gradient(1px 1px at 30% 80%, #fff 50%, transparent 51%),
            radial-gradient(circle at 30% 30%, #6a3cbc, #1b1340 70%);
    }
    .s-gold .league-avatar, .s-silver .league-avatar { position: relative; overflow: hidden; }
    .s-gold .league-avatar { background: linear-gradient(135deg, #b8860b, #f7d774 40%, #fff1a8 50%, #c9952b 70%, #8a6508); color: #5a3f00; }
    .s-silver .league-avatar { background: linear-gradient(135deg, #8e98a8, #e8edf3 45%, #ffffff 52%, #b6c0cc 70%, #6d7787); color: #3b4556; }
    .s-gold .league-avatar::after, .s-silver .league-avatar::after {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.75) 50%, transparent 65%);
        background-size: 250% 100%; animation: shine 2.8s ease-in-out infinite;
    }
    .s-lava .league-avatar { background: linear-gradient(120deg, #ff3d00, #ffb300, #ff3d00, #b71c1c); background-size: 300% 300%; animation: lava 4s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shine { 0% { background-position: 150% 0; } 60%, 100% { background-position: -100% 0; } }
    @keyframes lava { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @media (prefers-reduced-motion: reduce) { .f-flame::before, .s-gold .league-avatar::after, .s-silver .league-avatar::after, .s-lava .league-avatar { animation: none; } }

    /* Choix « verrouillé » */
    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .sw { position: relative; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
    .sw.locked::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
    .sw.locked::after { content: '🔒'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

    /* Laurier (remplace le cadre « couronne ») : anneau doré + deux branches en bas */
    .f-laurel::before { background: conic-gradient(#fff3b0, #e0b23a, #c9952b, #ffe680, #e0b23a, #fff3b0); }
    .laurel { position: absolute; width: 30px; height: 30px; bottom: -6px; filter: hue-rotate(-40deg) saturate(1.4) brightness(1.05) drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
    .laurel.l { left: -12px; transform: rotate(-30deg); }
    .laurel.r { right: -12px; transform: scaleX(-1) rotate(-30deg); }
    .av.small .laurel { width: 17px; height: 17px; bottom: -4px; }
    .av.small .laurel.l { left: -7px; } .av.small .laurel.r { right: -7px; }

    /* Vitrine */
    .shop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .shop-head .left { color: var(--muted); font-weight: 800; font-size: 0.9rem; }
    .vitrine { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .vit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border: 2px solid var(--line); border-radius: 14px; text-align: center; }
    .vit b { font-size: 0.78rem; line-height: 1.15; }
    .vit .price { font-size: 0.8rem; }
    .vit .badge-new { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 0 6px; border-radius: 8px; background: var(--red); color: #fff; font-size: 0.65rem; font-weight: 900; white-space: nowrap; }
    .vit.is-event { border-color: #ff7a00; background: rgba(255, 122, 0, 0.08); }
    .vit.is-event .badge-new { background: #ff7a00; }
    .weeks { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    .weeks th, .weeks td { padding: 6px 4px; border-bottom: 2px solid var(--line); text-align: left; vertical-align: top; }
    .weeks th { color: var(--muted); }
    .note { margin: 10px 0 0; padding: 8px 10px; border-radius: 12px; background: var(--bg); font-weight: 700; font-size: 0.9rem; }

    /* Couleurs et dessins de base */
    .base { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 8px; }
    .base .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.68rem; font-weight: 900; color: var(--muted); }
    .base .sw { width: 100%; }
    .pics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 8px; margin-top: 8px; }
    .pic { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); border-radius: 12px; }
    .pic .emoji-img { width: 60%; }
    .pic.locked .emoji-img { filter: grayscale(1); opacity: 0.3; }
    .pic.locked::after { content: '🔒'; position: absolute; font-size: 0.9rem; }

    /* Podium (comme dans le jeu) */
    .pods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pod { border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px 0; }
    .pod h3 { margin: 0 0 6px; font-size: 0.9rem; text-align: center; }
    .pod .league-podium { gap: 4px; }
    .pod .podium-col { gap: 2px; }
    .pod .podium-name { font-size: 0.8rem; }
    .pod .podium-step { height: auto; }
    .pod .place-1 .podium-step { height: 54px; } .pod .place-2 .podium-step { height: 40px; } .pod .place-3 .podium-step { height: 30px; }
    .pod .league-avatar { width: 40px !important; height: 40px !important; font-size: 1.1rem !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const emoji = e => {
    let cps = [...e].map(c => c.codePointAt(0)).filter(cp => cp !== 0xFE0F);
    const img = document.createElement('img');
    img.className = 'emoji-img';
    img.src = `emoji/${cps.map(cp => cp.toString(16)).join('-')}.svg`;
    img.alt = e;
    return img;
};
function avatar({ cls = '', hue = 200, letter = 'A', pic = null, tag = null, top = false, small = false, laurel = false }) {
    const w = document.createElement('span');
    w.className = `av ${small ? 'small ' : ''}${cls}`;
    const a = document.createElement('span');
    a.className = 'league-avatar';
    a.style.setProperty('--hue', hue);
    if (pic) a.append(emoji(pic)); else a.textContent = letter;
    w.append(a);
    if (laurel) ['l', 'r'].forEach(side => { const b = emoji('🌿'); b.className = `laurel ${side}`; w.append(b); });
    if (tag) { const t = emoji(tag); t.classList.add('av-tag'); if (top) t.classList.add('top'); w.append(t); }
    return w;
}
const wrap = document.getElementById('wrap');
function card(title, text) {
    const c = document.createElement('article');
    c.className = 'card';
    c.innerHTML = `<h2>${title}</h2><p>${text}</p>`;
    wrap.append(c);
    return c;
}
function grid(c, items) {
    const g = document.createElement('div');
    g.className = 'grid';
    for (const it of items) {
        const d = document.createElement('div');
        d.className = 'item';
        d.append(avatar(it.av));
        const b = document.createElement('b'); b.textContent = it.name;
        const s = document.createElement('small'); s.innerHTML = it.how;
        d.append(b, s);
        g.append(d);
    }
    c.append(g);
}

const FRAMES = [
    { name: 'Laurier', how: '10 semaines 1er de la ligue des amis', av: { cls: 'frame f-laurel', hue: 210, pic: '🦉', tag: '🏆', laurel: true } },
    { name: 'Flamme', how: 'Série de 30 jours', av: { cls: 'frame f-flame', hue: 15, letter: 'L', tag: '🔥' } },
    { name: 'Maître', how: 'Palier 5 d’entraînement dans un thème', av: { cls: 'frame f-master', hue: 265, pic: '🦊', tag: '⭐' } },
    { name: 'Halloween 2026', how: 'Événement (45 questions trouvées)', av: { cls: 'frame f-halloween', hue: 30, pic: '🎃', tag: '🎃' } }
];
grid(card('🏅 Cadres à gagner', 'Impossibles à acheter : ils prouvent qu’on a vraiment joué. Le petit emblème dans le coin dit d’où vient le cadre.'), FRAMES);

const STYLES = [
    { name: 'Coucher de soleil', how: '<span class="price">500 🪙</span>', av: { cls: 's-sunset', letter: 'T' } },
    { name: 'Océan', how: '<span class="price">500 🪙</span>', av: { cls: 's-ocean', pic: '🐋' } },
    { name: 'Aurore', how: '<span class="price">500 🪙</span>', av: { cls: 's-aurora', letter: 'S' } },
    { name: 'Arc-en-ciel', how: '<span class="price">800 🪙</span>', av: { cls: 's-rainbow', pic: '🦄' } },
    { name: 'Galaxie', how: '<span class="price">800 🪙</span>', av: { cls: 's-galaxy', pic: '🚀' } },
    { name: 'Lave (animée)', how: '<span class="price">1 500 🪙</span>', av: { cls: 's-lava', pic: '🐉' } },
    { name: 'Argent (brillant)', how: '<span class="price">1 500 🪙</span>', av: { cls: 's-silver', letter: 'N' } },
    { name: 'Or (brillant)', how: '<span class="price">1 500 🪙</span>', av: { cls: 's-gold', letter: 'J' } }
];
grid(card('✨ Couleurs spéciales', 'À acheter à la boutique (prix d’exemple). Les animées bougent doucement.'), STYLES);

// Dans le jeu : liste d'amis (petite taille)
const list = card('👥 Dans la liste d’amis', 'Même chose en petit, comme dans le classement, les duels et sur le parcours.');
[
    ['Léa', { cls: 'frame f-laurel', hue: 210, pic: '🦉', tag: '🏆', laurel: true, small: true }],
    ['Tom', { cls: 'frame f-flame', hue: 15, letter: 'T', tag: '🔥', small: true }],
    ['Inès', { cls: 's-gold', letter: 'I', small: true }],
    ['Noé', { cls: 'frame f-master s-galaxy', pic: '🚀', tag: '⭐', small: true }],
    ['Sacha', { hue: 140, letter: 'S', small: true }]
].forEach(([name, av]) => {
    const r = document.createElement('div');
    r.className = 'row';
    const n = document.createElement('span'); n.className = 'who'; n.textContent = name;
    r.append(avatar(av), n);
    list.append(r);
});

// Choix des couleurs : 12 de départ + 12 à débloquer (cadenas)

/* ===== Sections ajoutées en tête de page ===== */
const top3 = [];

// 1) Vitrine de la semaine
const vit = card('🛍️ 1) La vitrine de la semaine', 'Tout en haut de la Boutique. Chaque lundi, 4 objets changent, les mêmes pour tout le monde.');
vit.querySelector('h2').outerHTML = '<div class="shop-head"><h2>🛍️ Vitrine de la semaine</h2><span class="left">⏳ encore 3 jours</span></div>';
const v = document.createElement('div');
v.className = 'vitrine';
[
    { name: 'Galaxie', price: '800 🪙', av: { cls: 's-galaxy', pic: '🚀', small: false }, tag: 'Nouveau' },
    { name: 'Océan', price: '500 🪙', av: { cls: 's-ocean', letter: 'M' } },
    { name: 'Dragon', price: '300 🪙', av: { hue: 120, pic: '🐉' }, tag: 'Dessin' },
    { name: 'Citrouille', price: '600 🪙', av: { cls: 'frame f-halloween', hue: 30, letter: 'M' }, tag: 'Halloween', event: true }
].forEach(it => {
    const d = document.createElement('div');
    d.className = `vit${it.event ? ' is-event' : ''}`;
    if (it.tag) { const t = document.createElement('span'); t.className = 'badge-new'; t.textContent = it.tag; d.append(t); }
    const av = avatar(it.av);
    av.querySelector('.league-avatar').style.cssText = 'width:44px;height:44px;font-size:1.2rem';
    const b = document.createElement('b'); b.textContent = it.name;
    const pr = document.createElement('span'); pr.className = 'price'; pr.textContent = it.price;
    d.append(av, b, pr);
    v.append(d);
});
vit.append(v);
const tbl = document.createElement('table');
tbl.className = 'weeks';
tbl.innerHTML = `<tr><th>Semaine</th><th>Les 4 objets</th></tr>
<tr><td>26 oct.</td><td>🆕 Galaxie · Océan · 🐉 Dragon · 🎃 <b>Cadre citrouille</b> (exclusif Halloween)</td></tr>
<tr><td>2 nov.</td><td>🆕 Néon · Coucher de soleil · 🦚 Paon · Aurore</td></tr>
<tr><td>9 nov.</td><td>🆕 Marbre · Galaxie (revient) · 🧜 Sirène · Forêt</td></tr>
<tr><td>16 nov.</td><td>🆕 Or brillant · Lavande · 🐲 Dragon chinois · Océan (revient)</td></tr>`;
vit.append(tbl);
const vn = document.createElement('p');
vn.className = 'note';
vn.innerHTML = 'La règle : chaque semaine <b>1 nouveauté</b> jamais vue, <b>2 couleurs</b> déjà sorties qui reviennent (pour ceux qui les ont ratées), <b>1 dessin</b> rare. Pendant un événement, un des 4 est un objet <b>exclusif</b> qui ne reviendra jamais. Ce qu’on achète se choisit ensuite dans « Mon avatar ».';
vit.append(vn);
top3.push(vit);

// 2) Couleurs et dessins de base : 12 + 15 au départ, le reste débloqué EN JOUANT (pas à acheter)
const base = card('🎨 2) Couleurs et dessins de base', 'Ils ne s’achètent pas : ils se gagnent en jouant. Un nouveau joueur a 12 couleurs et 15 dessins ; les autres ont un cadenas avec ce qu’il faut faire.');
const bg = document.createElement('div');
bg.className = 'base';
let lvl = 0;
for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    const s = document.createElement('span');
    const locked = i % 2 === 1;
    s.className = `sw${locked ? ' locked' : ''}`;
    s.style.background = `hsl(${i * 15} 65% 52%)`;
    const l = document.createElement('span');
    l.textContent = locked ? `Niv. ${(++lvl) * 10}` : 'Départ';
    c.append(s, l);
    bg.append(c);
}
base.append(bg);
const pics = document.createElement('div');
pics.className = 'pics';
[['🦉', 0], ['🐱', 0], ['🐶', 0], ['🦊', 0], ['🐼', 0], ['⚽', 0], ['🦈', 'Badge « Premiers pas »'], ['🦖', 'Série de 7 jours'], ['🚀', '1er duel gagné'], ['🦄', 'Objectif du jour ×10'], ['🎸', 'Palier 3 en Musique'], ['👽', '10/10 au défi du jour']].forEach(([e, how]) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;font-size:0.62rem;font-weight:900;color:var(--muted);text-align:center;line-height:1.1';
    const d = document.createElement('div');
    d.className = `pic${how ? ' locked' : ''}`;
    d.style.width = '100%';
    d.append(emoji(e));
    const l = document.createElement('span');
    l.textContent = how || 'Départ';
    c.append(d, l);
    pics.append(c);
});
base.append(pics);
const bn = document.createElement('p');
bn.className = 'note';
bn.innerHTML = 'Couleurs : une de plus tous les 10 niveaux du parcours (niveaux 10 à 120). Dessins : liés à des badges et des exploits faciles. Un tap sur un cadenas dit comment l’ouvrir. <b>Les joueurs actuels gardent tout ce qu’ils ont déjà</b> : le cadenas ne touche que les nouveaux.';
base.append(bn);
top3.push(base);

// 3) Ligue : la couronne = cette semaine ; le cadre = gagné pour toujours
const lg = card('🥇 3) Ligue : couronne ou cadre ?', 'Deux choses différentes, qui ne se mélangent pas.');
const pods = document.createElement('div');
pods.className = 'pods';
function podium(title, list) {
    const box = document.createElement('div');
    box.className = 'pod';
    box.innerHTML = `<h3>${title}</h3>`;
    const p = document.createElement('div');
    p.className = 'league-podium';
    [1, 0, 2].forEach(i => {
        const r = list[i];
        const col = document.createElement('div');
        col.className = `podium-col place-${i + 1}`;
        col.style.animation = 'none';
        const crown = document.createElement('span');
        crown.className = 'podium-crown';
        crown.textContent = i === 0 ? '👑' : '';
        const av = avatar(r.av);
        if (!r.av.cls) av.querySelector('.league-avatar').classList.add(`ring-${i + 1}`);
        const n = document.createElement('span'); n.className = 'podium-name'; n.textContent = r.name;
        const st = document.createElement('div'); st.className = 'podium-step'; st.textContent = i + 1;
        col.append(crown, av, n, st);
        p.append(col);
    });
    box.append(p);
    return box;
}
pods.append(
    podium('Cette semaine', [{ name: 'Léa', av: { hue: 330, letter: 'L' } }, { name: 'Tom', av: { cls: 'frame f-laurel', hue: 210, pic: '🦉', tag: '🏆', laurel: true } }, { name: 'Toi', av: { hue: 140, letter: 'M' } }]),
    podium('La semaine d’après', [{ name: 'Tom', av: { cls: 'frame f-laurel', hue: 210, pic: '🦉', tag: '🏆', laurel: true } }, { name: 'Toi', av: { hue: 140, letter: 'M' } }, { name: 'Léa', av: { hue: 330, letter: 'L' } }])
);
lg.append(pods);
const ln = document.createElement('p');
ln.className = 'note';
ln.innerHTML = '👑 <b>La couronne</b> = 1er <b>cette semaine</b>. Elle change de tête chaque semaine (ici Léa, puis Tom).<br>🌿 <b>Le cadre laurier</b> = Tom a déjà fini 1er <b>10 semaines</b> dans le passé : il le garde <b>pour toujours</b>, partout (podium, liste, duels, parcours), même quand il n’est pas 1er.<br>Le cadre n’a donc plus de couronne : pas de confusion avec le podium.';
lg.append(ln);
top3.push(lg);

top3.reverse().forEach(c => wrap.prepend(c));
</script>
</body>
</html>
