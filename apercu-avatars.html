<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu avatars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Page d'APERÇU seulement (2026-10-24) : cadres à gagner et couleurs spéciales, pour choisir avant de les mettre dans le jeu. -->
<style>
    body { padding: 16px; }
    .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 16px; }
    .card h2 { margin: 0 0 4px; }
    .card > p { margin: 0 0 12px; color: var(--muted); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 12px 6px; border: 2px solid var(--line); border-radius: 16px; }
    .item b { font-size: 0.95rem; }
    .item small { color: var(--muted); font-weight: 700; line-height: 1.3; }
    .price { color: #c9952b; font-weight: 900; }
    .row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 2px solid var(--line); font-weight: 800; }
    .row:last-child { border-bottom: 0; }
    .row .who { flex: 1; }

    /* Avatar de base (comme dans le jeu) */
    .av { position: relative; display: inline-flex; flex: none; }
    .av .league-avatar { width: 64px; height: 64px; font-size: 1.7rem; }
    .av.small .league-avatar { width: 34px; height: 34px; font-size: 0.95rem; border-width: 2px; }
    .av .league-avatar .emoji-img { width: 60%; height: 60%; }

    /* ---------- CADRES À GAGNER ---------- */
    .frame .league-avatar { box-shadow: none; }
    .frame::before { content: ''; position: absolute; inset: -5px; border-radius: 50%; z-index: -1; }
    .av.small.frame::before { inset: -3px; }
    .frame { z-index: 0; }
    .av-tag { position: absolute; width: 26px; height: 26px; right: -6px; bottom: -4px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25)); }
    .av.small .av-tag { width: 16px; height: 16px; right: -5px; bottom: -3px; }
    .av-tag.top { right: auto; left: 50%; bottom: auto; top: -18px; transform: translateX(-50%); width: 30px; height: 30px; }
    .av.small .av-tag.top { top: -11px; width: 18px; height: 18px; }

    /* Champion de la ligue : or */
    .f-champion::before { background: conic-gradient(#fff3b0, #ffc800, #c9952b, #ffe680, #ffc800, #fff3b0); box-shadow: 0 0 14px rgba(255, 200, 0, 0.6); }
    /* Série de 30 jours : flamme qui tourne */
    .f-flame::before { background: conic-gradient(#ff3d00, #ff9100, #ffd600, #ff9100, #ff3d00); animation: spin 2.5s linear infinite; box-shadow: 0 0 14px rgba(255, 110, 0, 0.55); }
    /* Maître : violet et or */
    .f-master::before { background: conic-gradient(#8b5cf6, #c4b5fd, #ffc800, #8b5cf6, #c4b5fd, #ffc800, #8b5cf6); }
    /* Événement Halloween */
    .f-halloween::before { background: repeating-conic-gradient(#ff7a00 0 30deg, #2b1b3d 30deg 60deg); }

    /* ---------- COULEURS SPÉCIALES (à acheter) ---------- */
    .s-sunset .league-avatar { background: linear-gradient(135deg, #ffb347, #ff4f8b); }
    .s-ocean .league-avatar { background: linear-gradient(135deg, #2bd2ff, #2b5cff); }
    .s-aurora .league-avatar { background: linear-gradient(135deg, #43e97b, #38b6ff, #8b5cf6); }
    .s-rainbow .league-avatar { background: conic-gradient(#ff4d4d, #ffb84d, #f9f871, #4dff88, #4dd2ff, #8b5cf6, #ff4dd2, #ff4d4d); }
    .s-galaxy .league-avatar {
        background:
            radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 70% 20%, #fff 50%, transparent 51%),
            radial-gradient(1px 1px at 55% 70%, #fff 50%, transparent 51%),
            radial-gradient(1px 1px at 30% 80%, #fff 50%, transparent 51%),
            radial-gradient(circle at 30% 30%, #6a3cbc, #1b1340 70%);
    }
    .s-gold .league-avatar, .s-silver .league-avatar { position: relative; overflow: hidden; }
    .s-gold .league-avatar { background: linear-gradient(135deg, #b8860b, #f7d774 40%, #fff1a8 50%, #c9952b 70%, #8a6508); color: #5a3f00; }
    .s-silver .league-avatar { background: linear-gradient(135deg, #8e98a8, #e8edf3 45%, #ffffff 52%, #b6c0cc 70%, #6d7787); color: #3b4556; }
    .s-gold .league-avatar::after, .s-silver .league-avatar::after {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.75) 50%, transparent 65%);
        background-size: 250% 100%; animation: shine 2.8s ease-in-out infinite;
    }
    .s-lava .league-avatar { background: linear-gradient(120deg, #ff3d00, #ffb300, #ff3d00, #b71c1c); background-size: 300% 300%; animation: lava 4s ease-in-out infinite; }

    /* Cadres à gagner (prestige) */
    .f-ember::before { background: conic-gradient(#7a0b00, #ff3d00, #7a0b00, #ff7a00, #7a0b00); box-shadow: 0 0 10px rgba(255, 61, 0, 0.6); animation: pulse 1.6s ease-in-out infinite; }
    .f-phoenix::before { background: conic-gradient(#ffd600, #ff6d00, #d50000, #ff6d00, #ffd600); animation: spin 3s linear infinite; box-shadow: 0 0 16px rgba(255, 160, 0, 0.8); }
    .f-laurel-green::before { background: conic-gradient(#a5d66f, #4f9a2b, #a5d66f, #4f9a2b, #a5d66f); }
    .laurel.green { filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
    .f-diamond::before { background: conic-gradient(#b9f3ff, #5ad1ff, #ffffff, #a78bfa, #5ad1ff, #b9f3ff); animation: spin 4s linear infinite; box-shadow: 0 0 14px rgba(90, 209, 255, 0.7); }
    .f-swords::before { background: conic-gradient(#d9dee6, #8a94a6, #d9dee6, #5b6577, #d9dee6); }
    .f-gladiator::before { background: conic-gradient(#b71c1c, #d9dee6, #b71c1c, #8a94a6, #b71c1c); }
    .f-explorer::before { background: repeating-conic-gradient(#8d6e63 0 15deg, #c8a27a 15deg 30deg); }
    .f-globe::before { background: conic-gradient(#1e88e5, #43a047, #1e88e5, #43a047, #1e88e5); }
    .f-grandmaster::before { background: conic-gradient(#8b5cf6, #ffc800, #ec4899, #8b5cf6); animation: spin 3s linear infinite; box-shadow: 0 0 14px rgba(139, 92, 246, 0.7); }
    .f-collector::before { background: conic-gradient(#9aa6bd, #1899d6, #8b5cf6, #ffc800, #9aa6bd); }
    .f-perfect::before { background: repeating-conic-gradient(#ffc800 0 10deg, #ffffff 10deg 20deg); }
    .f-xmas::before { background: repeating-conic-gradient(#d50000 0 15deg, #ffffff 15deg 30deg); }
    /* Cadres de la boutique (décoratifs) */
    .f-dots::before { background: radial-gradient(circle, #ff4f8b 30%, transparent 32%) 0 0 / 8px 8px, #ffe1ec; }
    .f-stripes::before { background: repeating-linear-gradient(45deg, #2b5cff 0 4px, #ffffff 4px 8px); }
    .f-neon-pink::before { background: #ff2bd6; box-shadow: 0 0 6px #ff2bd6, 0 0 16px #ff2bd6; }
    .f-neon-blue::before { background: #00e5ff; box-shadow: 0 0 6px #00e5ff, 0 0 16px #00e5ff; }
    .f-rainbow::before { background: conic-gradient(#ff4d4d, #ffb84d, #f9f871, #4dff88, #4dd2ff, #8b5cf6, #ff4dd2, #ff4d4d); animation: spin 3s linear infinite; }
    .f-gold-plain::before { background: linear-gradient(135deg, #b8860b, #fff1a8, #c9952b); }
    .f-wood::before { background: repeating-linear-gradient(80deg, #8d5a2b 0 3px, #b07a45 3px 7px, #6d4320 7px 9px); }
    .f-pumpkin::before { background: radial-gradient(circle, #2b1b3d 30%, transparent 32%) 0 0 / 8px 8px, #ff9a3c; }
    /* 12 nouveaux cadres de boutique (2026-10-24, essai) : anneau un peu plus épais pour voir le motif */
    .thick::before { inset: -8px; }
    .av.small.thick::before { inset: -4px; }
    .n-checker::before { background: repeating-conic-gradient(#1b2745 0 25%, #ffffff 0 50%) 0 0 / 8px 8px; }
    .n-zigzag::before { background:
        linear-gradient(135deg, #ff9800 25%, transparent 25%) -4px 0 / 8px 8px,
        linear-gradient(225deg, #ff9800 25%, transparent 25%) -4px 0 / 8px 8px,
        linear-gradient(315deg, #ff9800 25%, transparent 25%) 0 0 / 8px 8px,
        linear-gradient(45deg, #ff9800 25%, #fff3e0 25%) 0 0 / 8px 8px; }
    .n-scales::before { background: radial-gradient(circle at 50% 0, transparent 38%, #4dd0a1 40% 58%, transparent 60%) 0 0 / 10px 7px, #0f6b4f; }
    .n-waves::before { background: radial-gradient(circle at 50% 100%, #7fdcff 38%, transparent 40%) 0 0 / 10px 6px, #1565c0; }
    .n-tartan::before { background:
        repeating-linear-gradient(0deg, rgba(198, 40, 40, 0.75) 0 3px, transparent 3px 9px),
        repeating-linear-gradient(90deg, rgba(198, 40, 40, 0.75) 0 3px, transparent 3px 9px),
        repeating-linear-gradient(0deg, transparent 0 4px, rgba(255, 214, 0, 0.6) 4px 5px, transparent 5px 9px),
        #1b5e20; }
    .n-pixels::before { background:
        conic-gradient(#ff4081 25%, #40c4ff 0 50%, #ffd740 0 75%, #69f0ae 0) 0 0 / 8px 8px; }
    .n-copper::before { background: conic-gradient(#7a3e1d, #e8925a, #ffd1a6, #b5602f, #5a2a10, #e8925a, #7a3e1d); }
    .n-frost::before { background: conic-gradient(#e3f6ff, #9fdcff, #ffffff, #b3e5fc, #e3f6ff); box-shadow: 0 0 10px rgba(130, 210, 255, 0.9); }
    .n-parchment::before { background: radial-gradient(circle at 30% 25%, #f7e9c4, #d9b779 60%, #a8834a); box-shadow: inset 0 0 0 2px #7a5a2a; }
    .n-music::before { background: conic-gradient(#7c4dff, #b388ff, #7c4dff); }
    .n-film::before { background: repeating-conic-gradient(#111111 0 9deg, #f5f5f5 9deg 13deg, #111111 13deg 18deg); }
    .n-confetti::before { background:
        radial-gradient(circle at 20% 30%, #ff4081 2px, transparent 2.5px),
        radial-gradient(circle at 70% 20%, #40c4ff 2px, transparent 2.5px),
        radial-gradient(circle at 80% 70%, #ffd740 2px, transparent 2.5px),
        radial-gradient(circle at 35% 80%, #69f0ae 2px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #b388ff 1.5px, transparent 2px) 0 0 / 9px 9px,
        #ffffff; box-shadow: 0 0 0 2px #ffd740; }
    .f-night::before { background: linear-gradient(135deg, #3a4a8c, #0d1333); }
    .deco { position: absolute; width: 16px; height: 16px; }
    .deco.a { top: -8px; left: -4px; } .deco.b { top: -8px; right: -4px; } .deco.c { bottom: -8px; left: 50%; transform: translateX(-50%); }
    /* Couleurs spéciales en plus */
    .s-forest .league-avatar { background: linear-gradient(135deg, #a8e063, #2e7d32); }
    .s-lavender .league-avatar { background: linear-gradient(135deg, #e0c3fc, #8b5cf6); }
    .s-peach .league-avatar { background: linear-gradient(135deg, #ffd1a9, #ff7e5f); }
    .s-mint .league-avatar { background: linear-gradient(135deg, #b8f5d8, #1fbf8f); }
    .s-night .league-avatar { background: linear-gradient(135deg, #3a4a8c, #0d1333); }
    .s-cherry .league-avatar { background: linear-gradient(135deg, #ffc1d9, #e0245e); }
    .s-marble .league-avatar { background: linear-gradient(120deg, transparent 40%, rgba(150,150,160,.5) 42%, transparent 46%), linear-gradient(60deg, transparent 60%, rgba(150,150,160,.45) 62%, transparent 65%), #f4f4f6; color: #555; }
    .s-wood .league-avatar { background: repeating-linear-gradient(80deg, #a0663a 0 4px, #c08552 4px 9px, #8a5530 9px 11px); }
    .s-jade .league-avatar { background: radial-gradient(circle at 30% 30%, #9ff2c8, #1b8a5a 70%); }
    .s-ruby .league-avatar { background: radial-gradient(circle at 30% 30%, #ff8a9a, #b0002a 70%); }
    .s-bronze .league-avatar { position: relative; overflow: hidden; background: linear-gradient(135deg, #7a4a1e, #e0a060 45%, #f5c890 52%, #a8682f 70%, #5c3412); color: #3b2008; }
    .s-bronze .league-avatar::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.6) 50%, transparent 65%); background-size: 250% 100%; animation: shine 2.8s ease-in-out infinite; }
    .s-neon .league-avatar { background: #12002b; color: #ff2bd6; text-shadow: 0 0 6px #ff2bd6; box-shadow: inset 0 0 10px #ff2bd6; }
    .s-boreal .league-avatar { background: linear-gradient(120deg, #00c9a7, #3d5afe, #b388ff, #00c9a7); background-size: 300% 300%; animation: lava 5s ease-in-out infinite; }
    .s-holo .league-avatar { background: linear-gradient(120deg, #ffd6f6, #c3f0ff, #fff6b8, #d8c8ff, #ffd6f6); background-size: 300% 300%; animation: lava 3.5s ease-in-out infinite; color: #6b5b95; }
    .s-snow .league-avatar { background: radial-gradient(2px 2px at 25% 30%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 70% 25%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 55% 75%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 30% 70%, #fff 50%, transparent 51%), linear-gradient(135deg, #9fd3ff, #3a7bd5); }
    .s-hearts .league-avatar { background: radial-gradient(circle at 30% 30%, #ff9ac1, #e0245e 75%); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shine { 0% { background-position: 150% 0; } 60%, 100% { background-position: -100% 0; } }
    @keyframes lava { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @media (prefers-reduced-motion: reduce) { .f-flame::before, .s-gold .league-avatar::after, .s-silver .league-avatar::after, .s-lava .league-avatar { animation: none; } }

    /* Choix « verrouillé » */
    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .sw { position: relative; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
    .sw.locked::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
    .sw.locked::after { content: '🔒'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

    /* Laurier (remplace le cadre « couronne ») : anneau doré + deux branches en bas */
    .f-laurel::before { background: conic-gradient(#fff3b0, #e0b23a, #c9952b, #ffe680, #e0b23a, #fff3b0); }
    .laurel { position: absolute; width: 30px; height: 30px; bottom: -6px; filter: hue-rotate(-40deg) saturate(1.4) brightness(1.05) drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
    .laurel.l { left: -12px; transform: rotate(-30deg); }
    .laurel.r { right: -12px; transform: scaleX(-1) rotate(-30deg); }
    .av.small .laurel { width: 17px; height: 17px; bottom: -4px; }
    .av.small .laurel.l { left: -7px; } .av.small .laurel.r { right: -7px; }

    /* Vitrine */
    .shop-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .shop-head .left { color: var(--muted); font-weight: 800; font-size: 0.9rem; }
    .vitrine { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .vit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border: 2px solid var(--line); border-radius: 14px; text-align: center; }
    .vit b { font-size: 0.78rem; line-height: 1.15; }
    .vit .price { font-size: 0.8rem; }
    .vit .badge-new { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 0 6px; border-radius: 8px; background: var(--red); color: #fff; font-size: 0.65rem; font-weight: 900; white-space: nowrap; }
    .vit.is-event { border-color: #ff7a00; background: rgba(255, 122, 0, 0.08); }
    .vit.is-event .badge-new { background: #ff7a00; }
    .weeks { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    .weeks th, .weeks td { padding: 6px 4px; border-bottom: 2px solid var(--line); text-align: left; vertical-align: top; }
    .weeks th { color: var(--muted); }
    .note { margin: 10px 0 0; padding: 8px 10px; border-radius: 12px; background: var(--bg); font-weight: 700; font-size: 0.9rem; }

    /* Couleurs et dessins de base */
    .base { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 8px; }
    .base .cell { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.68rem; font-weight: 900; color: var(--muted); }
    .base .sw { width: 100%; }
    .pics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 8px; margin-top: 8px; }
    .pic { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); border-radius: 12px; }
    .pic .emoji-img { width: 60%; }
    .pic.locked .emoji-img { filter: grayscale(0.7); opacity: 0.6; }
    .pic.locked::after { content: '🔒'; position: absolute; right: -4px; bottom: -4px; font-size: 0.8rem; }

    /* Podium (comme dans le jeu) */
    .pods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pod { border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px 0; }
    .pod h3 { margin: 0 0 6px; font-size: 0.9rem; text-align: center; }
    .pod .league-podium { gap: 4px; }
    .pod .podium-col { gap: 2px; }
    .pod .podium-name { font-size: 0.8rem; }
    .pod .podium-step { height: auto; }
    .pod .place-1 .podium-step { height: 54px; } .pod .place-2 .podium-step { height: 40px; } .pod .place-3 .podium-step { height: 30px; }
    .pod .league-avatar { width: 40px !important; height: 40px !important; font-size: 1.1rem !important; }
    .pod.keep .place-1 .frame::after, .pod.keep .place-2 .frame::after, .pod.keep .place-3 .frame::after {
        content: ''; position: absolute; inset: -10px; border-radius: 50%; z-index: -2; border: 3px solid var(--ring);
    }
    .pod.keep .place-1 { --ring: #ffc800; } .pod.keep .place-2 { --ring: #b8c2d3; } .pod.keep .place-3 { --ring: #d08a4f; }
    .unlock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin-top: 8px; }
    .unlock .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 0.68rem; font-weight: 800; color: var(--muted); line-height: 1.15; }
    .unlock .pic { width: 52px; }
    .free { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 6px 0 4px; }
    .sub { margin: 14px 0 0; font-weight: 900; }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const emoji = e => {
    let cps = [...e].map(c => c.codePointAt(0)).filter(cp => cp !== 0xFE0F);
    const img = document.createElement('img');
    img.className = 'emoji-img';
    img.src = `emoji/${cps.map(cp => cp.toString(16)).join('-')}.svg`;
    img.alt = e;
    return img;
};
function avatar({ cls = '', hue = 200, letter = 'A', pic = null, tag = null, top = false, small = false, laurel = false, deco = null, green = false }) {
    const w = document.createElement('span');
    w.className = `av ${small ? 'small ' : ''}${cls}`;
    const a = document.createElement('span');
    a.className = 'league-avatar';
    a.style.setProperty('--hue', hue);
    if (pic) a.append(emoji(pic)); else a.textContent = letter;
    w.append(a);
    if (laurel) ['l', 'r'].forEach(side => { const b = emoji('🌿'); b.className = `laurel ${side}${green ? ' green' : ''}`; w.append(b); });
    if (deco && !small) ['a', 'b', 'c'].forEach(k => { const b = emoji(deco); b.className = `deco ${k}`; w.append(b); });
    if (tag) { const t = emoji(tag); t.classList.add('av-tag'); if (top) t.classList.add('top'); w.append(t); }
    return w;
}
const wrap = document.getElementById('wrap');
function card(title, text) {
    const c = document.createElement('article');
    c.className = 'card';
    c.innerHTML = `<h2>${title}</h2><p>${text}</p>`;
    wrap.append(c);
    return c;
}
function grid(c, items) {
    const g = document.createElement('div');
    g.className = 'grid';
    for (const it of items) {
        const d = document.createElement('div');
        d.className = 'item';
        d.append(avatar(it.av));
        const b = document.createElement('b'); b.textContent = it.name;
        const s = document.createElement('small'); s.innerHTML = it.how;
        d.append(b, s);
        g.append(d);
    }
    c.append(g);
}

const FRAMES = [
    { name: 'Flamme', how: 'Série de 30 jours', av: { cls: 'frame f-flame', hue: 15, letter: 'L', tag: '🔥' } },
    { name: 'Braise', how: 'Série de 100 jours', av: { cls: 'frame f-ember', hue: 0, pic: '🐉', tag: '🔥' } },
